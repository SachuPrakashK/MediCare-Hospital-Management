<div class="date-picker">
  <button
    type="button"
    class="date-picker__control"
    [class.is-open]="open()"
    [class.has-value]="value()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    (click)="toggle()"
  >
    <span>{{ value() || placeholder() }}</span>
    <span class="date-picker__actions">
      @if (value() && !disabled()) {
        <span
          class="date-picker__clear"
          role="button"
          tabindex="0"
          aria-label="Clear date"
          (click)="clear($event)"
          (keydown.enter)="clear($event)"
          >×</span
        >
      }
      <app-icon name="calendar" [size]="18" />
    </span>
  </button>
  @if (open()) {
    <div class="date-picker__popup" role="dialog" aria-modal="false" [style]="popupStyle()">
      <app-calendar
        [value]="value()"
        [min]="min()"
        [max]="max()"
        [ariaLabel]="ariaLabel()"
        (valueChange)="select($event)"
      />
    </div>
  }
</div>
