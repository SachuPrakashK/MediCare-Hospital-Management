<section class="app-calendar" [attr.aria-label]="ariaLabel()" [attr.aria-disabled]="disabled()">
  <header>
    <button
      type="button"
      class="calendar-nav"
      aria-label="Previous month"
      [disabled]="disabled()"
      (click)="shift(-1)"
    >
      <app-icon name="chevron-left" [size]="17" />
    </button>
    <div class="calendar-period">
      <label>
        <span class="sr-only">Month</span>
        <select
          aria-label="Month"
          [disabled]="disabled()"
          [value]="visibleMonth()"
          (change)="setMonth(+$any($event.target).value)"
        >
          @for (name of monthNames; track name; let index = $index) {
            <option [value]="index" [selected]="index === visibleMonth()">{{ name }}</option>
          }
        </select>
      </label>
      <label>
        <span class="sr-only">Year</span>
        <select
          aria-label="Year"
          [disabled]="disabled()"
          [value]="visibleYear()"
          (change)="setYear(+$any($event.target).value)"
        >
          @for (year of years(); track year) {
            <option [value]="year" [selected]="year === visibleYear()">{{ year }}</option>
          }
        </select>
      </label>
      <span class="sr-only" aria-live="polite">{{ heading() }}</span>
    </div>
    <button
      type="button"
      class="calendar-nav"
      aria-label="Next month"
      [disabled]="disabled()"
      (click)="shift(1)"
    >
      <app-icon name="chevron-right" [size]="17" />
    </button>
  </header>
  <div class="weekdays" aria-hidden="true">
    @for (name of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; track name) {
      <span>{{ name }}</span>
    }
  </div>
  <div class="days">
    @for (day of days(); track day.iso) {
      <button
        type="button"
        [class.outside]="!day.currentMonth"
        [class.today]="day.today"
        [class.selected]="day.selected"
        [disabled]="day.disabled"
        [attr.aria-pressed]="day.selected"
        [attr.aria-label]="day.iso"
        (click)="select(day)"
      >
        {{ day.day }}
      </button>
    }
  </div>
  <footer>
    <button
      type="button"
      class="secondary"
      [disabled]="disabled() || !todayAvailable()"
      (click)="today()"
    >
      Today
    </button>
  </footer>
</section>
